services:
  nicotine-plus:
    image: ghcr.io/fletchto99/nicotine-plus-docker:latest
    container_name: nicotine-plus
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /srv/nicotineplus/config:/config
      - /srv/nicotineplus/downloads:/data/downloads
      - /srv/nicotineplus/incomplete:/data/incomplete_downloads
      - /srv/nicotineplus/shared:/data/shared #optional
    ports:
      - 6080:6080
      - 2234-2239:2234-2239
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nicotine-plus.entrypoints=https"
      - "traefik.http.routers.nicotine-plus.rule=Host(`nicotine-plus.local.joaopereira.ie`)"
      - "traefik.http.services.nicotine-plus.loadbalancer.server.port=6080"
    networks:
      - proxy

networks:
  proxy:
    external: true
